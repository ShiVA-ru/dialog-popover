<!doctype html>
<html lang="en">
    <head>
        <title>Dialog Popover</title>
        <script src="index.js" defer></script>
        <link rel="stylesheet" href="style.css" />
    </head>
    <body>
        <div id="dialog-popover">
            <div class="dialog-controls">
                <button class="open-button" onclick="window.myDialog.show()">
                    Open Dialog
                </button>
                <button
                    class="open-button"
                    onclick="window.myDialog.showModal()"
                >
                    Open Modal
                </button>
            </div>
            <dialog class="dialog" id="myDialog" aria-labelledby="dialog-name">
                <div class="dialog-content">
                    <h2 id="dialog-name">Dialog Title</h2>
                    <p>This is a dialog content.</p>
                    <button class="close-button"></button>
                </div>
            </dialog>
        </div>
    </body>
</html>
