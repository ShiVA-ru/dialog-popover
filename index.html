<!doctype html>
<html lang="en">
    <head>
        <title>Dialog Popover</title>
        <script src="index.js" defer></script>
        <link rel="stylesheet" href="style.css" />
    </head>
    <body>
        <div id="dialog-popover">
            <dialog class="dialog" aria-labelledby="dialog-name" open>
                <div class="dialog-content">
                    <h2 id="dialog-name">Dialog Title</h2>
                    <p>This is a dialog content.</p>
                    <button class="close-button"></button>
                </div>
            </dialog>
            <button class="open-button">Open Dialog</button>
        </div>
    </body>
</html>
