<!doctype html>
<html lang="en">
    <head>
        <title>Dialog Popover</title>
        <!-- <script src="index.js" defer></script> -->
        <link rel="stylesheet" href="style.css" />
    </head>
    <body>
        <div id="dialog-popover">
            <div class="controls">
                <button class="button" onclick="window.myDialog.show()">
                    Open Dialog
                </button>
                <button class="button" onclick="window.myDialog.showModal()">
                    Open Modal
                </button>
                <button class="button" popovertarget="myPopover">
                    Open Popover
                </button>
            </div>
            <dialog class="dialog" id="myDialog" aria-labelledby="dialog-name">
                <div class="dialog-content">
                    <h2 id="dialog-name">Dialog Title</h2>
                    <p>This is a dialog content.</p>
                    <button
                        class="close-button"
                        onclick="window.myDialog.close()"
                    ></button>
                </div>
            </dialog>
            <div class="popover" id="myPopover" popover>
                <h2>Popover title</h2>
                <p>Im simple popover</p>
            </div>
        </div>
    </body>
</html>
